name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo al mismo PR cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar ffmpeg
        # Sin ffmpeg las pruebas de conversión real se omiten; aquí se ejecutan todas.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check src scripts
          ruff format --check src scripts
      - name: Pytest
        run: python -m pytest -ra
