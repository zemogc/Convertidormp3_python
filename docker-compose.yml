# Entorno local completo: `docker compose up --build`
#   App:        http://localhost:8080
#   RabbitMQ:   http://localhost:15672  (guest / guest)
#   Emails:     http://localhost:8025   (Mailpit atrapa todos los correos)
#
# Con monitoreo: `docker compose --profile monitoring up -d --build`
#   Grafana:    http://localhost:3000   (dashboard "Convertidor", sin login)
#   Prometheus: http://localhost:9090

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    <<: *restart
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    <<: *restart
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"

  auth:
    <<: *restart
    build: ./src/auth
    environment:
      DATABASE_URL: postgresql+psycopg://auth_user:auth_password@postgres:5432/auth
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-cambiar-en-produccion}
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin12345
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *restart
    build: ./src/gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SVC_ADDRESS: auth:5000
      MONGO_URI: mongodb://mongo:27017
      RABBITMQ_HOST: rabbitmq
      MAX_UPLOAD_MB: "500"
      MAX_ACTIVE_JOBS: "5"
    depends_on:
      auth:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  converter:
    <<: *restart
    build: ./src/converter
    environment:
      MONGO_URI: mongodb://mongo:27017
      RABBITMQ_HOST: rabbitmq
      MAX_ATTEMPTS: "3"
      RETRY_DELAY_MS: "5000"
    deploy:
      replicas: 2
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification:
    <<: *restart
    build: ./src/notification
    environment:
      RABBITMQ_HOST: rabbitmq
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PUBLIC_URL: http://localhost:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  prometheus:
    <<: *restart
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    <<: *restart
    image: grafana/grafana:11.2.0
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/convertidor.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
