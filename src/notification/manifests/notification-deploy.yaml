apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: convertidor/notification:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: notification-configmap
            - secretRef:
                name: notification-secret
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
