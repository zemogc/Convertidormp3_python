# Valores de ejemplo para desarrollo local. En un cluster real crealos con
# `kubectl create secret generic auth-secret --from-literal=...` y no los versiones.
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://auth_user:auth_password@host.minikube.internal:5432/auth"
  JWT_SECRET: "cambia-este-secreto-por-uno-largo-y-aleatorio"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "admin12345"
